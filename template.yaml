
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: APS serverless modernization demo

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128

Resources:
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aps-applications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH

  # Configure CORS on the existing SAM-generated REST API.
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'http://127.0.0.1:5500'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.health.lambda_handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /health
            Method: GET

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.create_application.lambda_handler
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        CreateApplicationApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /applications
            Method: POST

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.get_application.lambda_handler
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        GetApplicationApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /applications/{applicationId}
            Method: GET

  ListApplicationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.handlers.list_applications.lambda_handler
      Environment:
        Variables:
          APPLICATIONS_TABLE: !Ref ApplicationsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ApplicationsTable
      Events:
        ListApplicationsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /applications
            Method: GET
